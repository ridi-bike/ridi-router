[package]
name = "rmdf-diff"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ridi-router-common = { path = "../../../crates/ridi-router-common" }
anyhow = "1"
bytemuck = { version = "1.14", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
debug = false
