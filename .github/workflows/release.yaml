name: Release

on: workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semver.outputs.next }}
      bump-commit-sha: ${{ steps.commit.outputs.commit-sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: main
          majorList: major
          patchList: chore, fix, bugfix, perf, refactor, test, tests

      - name: Update workspace version
        run: |
          VERSION="${{ steps.semver.outputs.next }}"
          VERSION_CLEAN="${VERSION#v}"
          sed -i "s/^version = .*/version = \"$VERSION_CLEAN\"/" Cargo.toml
          cargo update \
            --package ridi-router-cli \
            --package ridi-router-common \
            --package ridi-router-routing \
            --package ridi-router-tiles

      - name: Generate Release Notes
        run: |
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD^)..HEAD --pretty=format:"* %s" > RELEASE_NOTES.md

      - name: Commit Version Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Cargo.toml Cargo.lock
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.semver.outputs.next }}"
          git push origin main

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: RELEASE_NOTES
          path: RELEASE_NOTES.md

      - name: Get commit SHA
        id: commit
        run: echo "commit-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-rmdf-viewer:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.bump-commit-sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: x86_64-unknown-linux-gnu
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Normalize Cargo.toml and Cargo.lock versions for caching
        run: |
          cp Cargo.toml _cargo.toml
          cp Cargo.lock _cargo.lock
          sed -i 's/^version = ".*"/version = "0.0.0"/' _cargo.toml
          python <<'PY'
          from pathlib import Path

          workspace_packages = {
              "ridi-router-cli",
              "ridi-router-common",
              "ridi-router-routing",
              "ridi-router-tiles",
          }

          lock_path = Path("_cargo.lock")
          lines = lock_path.read_text().splitlines()
          normalized = []
          in_workspace_package = False

          for line in lines:
              if line == "[[package]]":
                  in_workspace_package = False
              elif line.startswith('name = "'):
                  name = line[len('name = "'):-1]
                  in_workspace_package = name in workspace_packages
              elif in_workspace_package and line.startswith('version = "'):
                  line = 'version = "0.0.0"'
                  in_workspace_package = False

              normalized.append(line)

          lock_path.write_text("\n".join(normalized) + "\n")
          PY
        shell: bash

      - name: Cache cargo and build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/_cargo.lock', '**/_cargo.toml', 'rust-toolchain.toml') }}-rmdf-viewer
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/_cargo.lock', '**/_cargo.toml', 'rust-toolchain.toml') }}-rmdf-viewer

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            crates/ridi-router-cli/src/debug/rmdf_viewer/ui/node_modules
          key: ${{ runner.os }}-pnpm
          restore-keys: |
            ${{ runner.os }}-pnpm

      - name: Install node_modules
        run: |
          cd crates/ridi-router-cli/src/debug/rmdf_viewer/ui/
          pnpm install

      - name: Build UI
        run: |
          cd crates/ridi-router-cli/src/debug/rmdf_viewer/ui/
          pnpm build

      - name: Build CLI with rmdf-viewer feature
        run: cargo build --release --target x86_64-unknown-linux-gnu --package ridi-router-cli --features rmdf-viewer

      - name: Prepare rmdf-viewer binary and create zip
        run: |
          mkdir -p dist
          cp "target/x86_64-unknown-linux-gnu/release/ridi-router-cli" "dist/ridi-router-cli-rmdf-viewer-linux-amd64"
          chmod +x "dist/ridi-router-cli-rmdf-viewer-linux-amd64"
          cd dist
          zip "ridi-router-cli-rmdf-viewer-linux-amd64.zip" "ridi-router-cli-rmdf-viewer-linux-amd64"

      - name: Upload rmdf-viewer binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-rmdf-viewer-linux-amd64
          path: dist/*.zip

  build:
    needs: prepare-version
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
          - os: macos-latest
            name: macos-universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.bump-commit-sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
          toolchain: stable

      - name: Normalize Cargo.toml and Cargo.lock versions for caching
        run: |
          cp Cargo.toml _cargo.toml
          cp Cargo.lock _cargo.lock
          python <<'PY'
          from pathlib import Path

          workspace_packages = {
              "ridi-router-cli",
              "ridi-router-common",
              "ridi-router-routing",
              "ridi-router-tiles",
          }

          lock_path = Path("_cargo.lock")
          lines = lock_path.read_text().splitlines()
          normalized = []
          in_workspace_package = False

          for line in lines:
              if line == "[[package]]":
                  in_workspace_package = False
              elif line.startswith('name = "'):
                  name = line[len('name = "'):-1]
                  in_workspace_package = name in workspace_packages
              elif in_workspace_package and line.startswith('version = "'):
                  line = 'version = "0.0.0"'
                  in_workspace_package = False

              normalized.append(line)

          lock_path.write_text("\n".join(normalized) + "\n")
          PY
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's/^version = ".*"/version = "0.0.0"/' _cargo.toml
          else
            sed -i 's/^version = ".*"/version = "0.0.0"/' _cargo.toml
          fi
        shell: bash

      - name: Cache cargo and build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/_cargo.lock', '**/_cargo.toml', 'rust-toolchain.toml') }}-release
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/_cargo.lock', '**/_cargo.toml', 'rust-toolchain.toml') }}-release

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --release --package ridi-router-cli --target x86_64-apple-darwin
            cargo build --release --package ridi-router-cli --target aarch64-apple-darwin

            mkdir -p dist
            lipo -create \
              "target/x86_64-apple-darwin/release/ridi-router-cli" \
              "target/aarch64-apple-darwin/release/ridi-router-cli" \
              -output "dist/ridi-router-cli-${{ matrix.name }}"
            chmod +x "dist/ridi-router-cli-${{ matrix.name }}"
          else
            cargo build --release --package ridi-router-cli --target ${{ matrix.target }}
          fi

      - name: Prepare binary and create zip
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/ridi-router-cli.exe" "dist/ridi-router-cli-${{ matrix.name }}.exe"
            cd dist
            powershell Compress-Archive "ridi-router-cli-${{ matrix.name }}.exe" "ridi-router-cli-${{ matrix.name }}.zip"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cd dist
            chmod +x "ridi-router-cli-${{ matrix.name }}"
            zip "ridi-router-cli-${{ matrix.name }}.zip" "ridi-router-cli-${{ matrix.name }}"
          else
            cp "target/${{ matrix.target }}/release/ridi-router-cli" "dist/ridi-router-cli-${{ matrix.name }}"
            chmod +x "dist/ridi-router-cli-${{ matrix.name }}"
            cd dist
            zip "ridi-router-cli-${{ matrix.name }}.zip" "ridi-router-cli-${{ matrix.name }}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*.zip

  create-release:
    needs: [prepare-version, build, build-rmdf-viewer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release_files
          cp artifacts/binary-*/ridi-router-cli-* release_files/
          cp artifacts/RELEASE_NOTES/RELEASE_NOTES.md .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-version.outputs.next_version }}
          name: Release ${{ needs.prepare-version.outputs.next_version }}
          body_path: RELEASE_NOTES.md
          files: |
            release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
