[package]
name = "ridi-router-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
default = []
rule-schema-writer = ["dep:anyhow", "dep:schemars"]
debug-split-gpx = []
rmdf-viewer = [
  "dep:anyhow",
  "dep:bytemuck",
  "dep:include_directory",
  "dep:memmap2",
  "dep:ridi-router-common",
  "dep:tiny_http",
  "dep:ts-rs",
]
debug-polygons = []
hotpath = ["hotpath/hotpath", "ridi-router-routing/hotpath"]
hotpath-alloc = [
  "hotpath",
  "hotpath/hotpath-alloc",
  "ridi-router-routing/hotpath-alloc",
]
hotpath-mcp = [
  "hotpath",
  "hotpath/hotpath-mcp",
  "ridi-router-routing/hotpath-mcp",
]

[dependencies]
anyhow = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
clap.workspace = true
geo.workspace = true
gpx.workspace = true
include_directory = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny_http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }
ridi-router-routing = { path = "../ridi-router-routing" }
ridi-router-common = { path = "../ridi-router-common", optional = true }
ridi-router-tiles = { path = "../ridi-router-tiles" }
hotpath.workspace = true

[dev-dependencies]
rusty-fork.workspace = true
ridi-router-test-support = { path = "../ridi-router-test-support" }

[build-dependencies]
static_vcruntime.workspace = true
