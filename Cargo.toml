[package]
name = "ridi-router"
version = "0.8.6"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true

[profile.dev]
opt-level = 3

[features]
default = []
rule-schema-writer = []
debug-split-gpx = []
rmdf-viewer = ["dep:tiny_http", "dep:ts-rs", "dep:include_directory"]
debug-polygons = []

[dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
bytemuck = { version = "1.14", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.5.9", features = ["derive"] }
csv = "1.3.1"
derive-name = "1.1.0"
geo = "0.30.0"
gpx = "0.10.0"
rstar = "0.12"
hdbscan = "0.10.0"
hex = "0.4"
include_directory = { version = "0.1.1", optional = true }
interprocess = "2.2.2"
json-tools = "1.1.3"
memmap2 = "0.9"
osmpbfreader = "0.16.1"
rayon = "1.10.0"
redb = "2.3"
schemars = "0.8.21"
serde = { version = "1.0.201", features = ["derive"] }
serde_derive = "1.0.201"
serde_json = "1.0.117"
sha2 = "0.10.8"
smartstring = "1.0.1"
struct-field-names-as-array = "0.3.0"
thiserror = "2.0.11"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
typeshare = { version = "1.0.4", default-features = false }
wide = "0.7"  # Safe SIMD on stable Rust - supports f32x8 (AVX2) and f32x16 (AVX-512)
num-traits = "0.2"
wkt = "0.14.0"
tiny_http = { version = "0.12", optional = true }
ts-rs = { version = "10", optional = true }

[dev-dependencies]
rusty-fork = "0.3.0"

[build-dependencies]
static_vcruntime = "2.0"
