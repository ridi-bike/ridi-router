[workspace]
members = [
  "crates/ridi-router-cli",
  "crates/ridi-router-common",
  "crates/ridi-router-routing",
  "crates/ridi-router-test-support",
  "crates/ridi-router-tiles",
]
resolver = "2"

[workspace.package]
version = "0.8.6"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.95"
bincode = "1.3.3"
bytemuck = { version = "1.14", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.5.9", features = ["derive"] }
csv = "1.3.1"
derive-name = "1.1.0"
geo = "0.30.0"
gpx = "0.10.0"
rstar = "0.12"
hdbscan = "0.10.0"
hex = "0.4"
include_directory = "0.1.1"
json-tools = "1.1.3"
memmap2 = "0.9"
osmpbfreader = "0.16.1"
rayon = "1.10.0"
redb = "2.3"
schemars = "0.8.21"
serde = { version = "1.0.201", features = ["derive"] }
serde_derive = "1.0.201"
serde_json = "1.0.117"
sha2 = "0.10.8"
smartstring = { version = "1.0.1", features = ["serde"] }
struct-field-names-as-array = "0.3.0"
thiserror = "2.0.11"
tiny_http = "0.12"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
ts-rs = "10"
typeshare = { version = "1.0.4", default-features = false }
wide = "0.7"
num-traits = "0.2"
wkt = "0.14.0"
static_vcruntime = "2.0"
rusty-fork = "0.3.0"

[profile.release]
codegen-units = 1
lto = true

[profile.dev]
opt-level = 3
